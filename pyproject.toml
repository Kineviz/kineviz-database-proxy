[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kineviz-database-proxy"
version = "1.1.3"
description = "Kineviz Database Proxy - Secure middleware for connecting GraphXR to databases"
authors = [{name="Sean Li", email="sean@kineviz.com"}, {name = "Kineviz", email = "support@kineviz.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "google-cloud-spanner>=3.40.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-resource-manager>=1.10.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth>=2.0.0",
    "aiofiles>=23.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "neo4j>=5.28.0,<6",
    # Wheel-tag matching, so the proxy can tell whether an engine release will
    # install here before it tries. See drivers/embedded/pypi.py.
    "packaging>=23.0",
    # The shared plumbing of the relational drivers: statement generation
    # and the cross-engine catalog read. A runtime dependency, not an extra,
    # because mssql / postgresql / mysql all use it; the DBAPIs under
    # [project.optional-dependencies] are the parts that are per-engine.
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
ui = [
    "aiofiles>=23.0.0",
]
# One group per relational engine, holding only its DBAPI. They are extras
# because a DBAPI is a compiled extension that may have no wheel for this
# interpreter, and the driver imports it lazily — SQLAlchemy can build the
# statement for the built-in dialects without their DBAPIs installed. Snowflake
# installs its own SQLAlchemy dialect through the optional extra below.
# pyodbc is deliberately *not* the SQL Server default: 5.2.0 tops out at cp313
# and this project's venv is CPython 3.14.2, while pymssql ships cp314 wheels.
mssql = ["pymssql>=2.3"]
postgresql = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
# Snowflake's dialect uses SQLAlchemy 2.0 compiler APIs removed in 2.1.
snowflake = ["snowflake-sqlalchemy>=1.7", "sqlalchemy>=2.0,<2.1"]
relational = ["kineviz-database-proxy[mssql,postgresql,mysql,snowflake]"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
]
# `relational` pulls the engine dependency groups, so it is the one name to extend.
all = [
    "kineviz-database-proxy[ui,dev,relational]",
]

[project.scripts]
kineviz-proxy = "graphxr_database_proxy.launcher:main"
graphxr-proxy = "graphxr_database_proxy.launcher:main"

[project.urls]
Homepage = "https://github.com/Kineviz/kineviz-database-proxy"
Documentation = "https://docs.kineviz.com/kineviz-database-proxy"
Repository = "https://github.com/Kineviz/kineviz-database-proxy"
"Bug Tracker" = "https://github.com/Kineviz/kineviz-database-proxy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"graphxr_database_proxy" = [
    "static/*",
    "static/**/*",
    # The annotated mapping example the UI shows and a person can upload.
    # MANIFEST.in carries the matching rule for the sdist.
    "drivers/relational/data/*.yml",
]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
