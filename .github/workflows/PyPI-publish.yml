name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # When pushing a version tag (e.g., v1.0.0)
  
  workflow_dispatch:  #allow manual trigger
    inputs:
      target:
        description: 'Publish target'
        required: true
        default: 'testpypi'
        type: choice
        options:
        - testpypi
        - pypi

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build frontend
      run: |
        npm run install:frontend
        npm run typecheck
        python scripts/build_frontend.py

    - name: Validate release version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)
        test "$GITHUB_REF_NAME" = "v$VERSION"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        echo "🔄 Building package..."
        python -m build
        echo "✅ Package built successfully"
    
    - name: Check package
      run: |
        echo "🔍 Checking package..."
        twine check dist/*
        echo "✅ Package check passed"
    
    - name: List built files
      run: |
        echo "📦 Built files:"
        ls -la dist/
    
    # Validate secrets are configured
    - name: Validate secrets
      run: |
        echo "🔐 Validating secrets configuration..."
        if [ "${{ github.event.inputs.target }}" == "testpypi" ] || [ "${{ contains(github.ref, 'alpha') }}" == "true" ]; then
          if [ -z "${{ secrets.TEST_PYPI_API_TOKEN }}" ]; then
            echo "❌ ERROR: TEST_PYPI_API_TOKEN secret is not configured"
            exit 1
          fi
          echo "✅ TEST_PYPI_API_TOKEN is configured"
        else
          if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "❌ ERROR: PYPI_API_TOKEN secret is not configured"
            exit 1
          fi
          echo "✅ PYPI_API_TOKEN is configured"
        fi
    
    # Publish to TestPyPI (manual trigger or dev branch)
    - name: Publish to TestPyPI
      if: ${{ github.event.inputs.target == 'testpypi' || (github.event_name == 'push' && contains(github.ref, 'alpha')) }}
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        echo "🧪 Publishing to TestPyPI..."
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "❌ ERROR: TEST_PYPI_API_TOKEN is empty or not set"
          echo "Please configure TEST_PYPI_API_TOKEN in repository secrets"
          exit 1
        fi
        echo "Token length: ${#TWINE_PASSWORD} characters"
        twine upload --repository testpypi dist/* --verbose
        echo "✅ Published to TestPyPI successfully"
    
    # Publish to production PyPI (tag release)
    - name: Publish to PyPI
      if: ${{ github.event.inputs.target == 'pypi' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'alpha')) }}
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        echo "🚀 Publishing to PyPI..."
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "❌ ERROR: PYPI_API_TOKEN is empty or not set"
          echo "Please configure PYPI_API_TOKEN in repository secrets"
          exit 1
        fi
        echo "Token length: ${#TWINE_PASSWORD} characters"
        twine upload dist/* --verbose
        echo "✅ Published to PyPI successfully"
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        cat > release-notes.md <<EOF
        Kineviz Database Proxy $VERSION includes the admin Web UI.

        Install: pip install kineviz-database-proxy==$VERSION

        Start: kineviz-proxy

        Python imports now use kineviz_database_proxy. The graphxr-proxy command remains supported.

        PyPI: https://pypi.org/project/kineviz-database-proxy/$VERSION/
        EOF
        PRERELEASE=()
        if [[ "$VERSION" == *alpha* || "$VERSION" == *beta* || "$VERSION" == *rc* ]]; then
          PRERELEASE=(--prerelease)
        fi
        gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
          --title "Kineviz Database Proxy $GITHUB_REF_NAME" \
          --notes-file release-notes.md "${PRERELEASE[@]}"
