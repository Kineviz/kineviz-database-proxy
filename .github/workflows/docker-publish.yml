name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*'
      - 'docker-v*'
  workflow_dispatch:
    inputs:
      registry:
        description: Docker registry to push to
        required: true
        default: dockerhub
        type: choice
        options:
          - dockerhub
          - aliyun
          - both

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Get image tags
        id: version
        env:
          REQUESTED_REGISTRY: ${{ inputs.registry }}
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/docker-v* ]]; then
            VERSION=${GITHUB_REF_NAME#docker-v}
            test "$VERSION" = "$PACKAGE_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
            test "$VERSION" = "$PACKAGE_VERSION"
          elif [[ "$GITHUB_REF" == refs/heads/develop ]]; then
            VERSION=develop
          else
            VERSION=latest
          fi
          REGISTRY=${REQUESTED_REGISTRY:-dockerhub}
          {
            echo "registry=$REGISTRY"
            echo "version=$VERSION"
            echo 'tags<<IMAGE_TAGS'
            for REPOSITORY in kineviz/kineviz-database-proxy registry.cn-hangzhou.aliyuncs.com/kineviz/kineviz-database-proxy; do
              if [[ "$REPOSITORY" == registry.cn-hangzhou.aliyuncs.com/* && "$REGISTRY" == dockerhub ]]; then
                continue
              fi
              if [[ "$REPOSITORY" == kineviz/* && "$REGISTRY" == aliyun ]]; then
                continue
              fi
              echo "$REPOSITORY:$VERSION"
              if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "$REPOSITORY:latest"
              fi
            done
            echo IMAGE_TAGS
          } >> "$GITHUB_OUTPUT"

      - name: Build and check frontend
        run: |
          npm run install:frontend
          npm run typecheck
          npm run build
          test -s frontend/dist/index.html

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.version.outputs.registry != 'aliyun'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME_PUBLIC_REPO }}
          password: ${{ secrets.DOCKER_PASSWORD_PUBLIC_REPO }}

      - name: Login to Aliyun Container Registry
        if: steps.version.outputs.registry != 'dockerhub'
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME_PUBLIC_REPO }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD_PUBLIC_REPO }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha,scope=docker
          cache-to: type=gha,mode=max,scope=docker
          platforms: linux/amd64,linux/arm64

      - name: Image summary
        env:
          IMAGE_TAGS: ${{ steps.version.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '## Published Docker images'
            echo
            echo "Digest: $IMAGE_DIGEST"
            while IFS= read -r TAG; do
              echo "docker pull $TAG"
            done <<< "$IMAGE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
